# ---------------------------------------------------------------------------
# Nginx reverse proxy configuration for a Django / Gunicorn application
#
# This configuration handles:
#   - TLS termination with Let's Encrypt certificates
#   - Reverse proxying to Gunicorn
#   - Static and media file serving
#   - Security headers
#   - Gzip compression
#   - Basic rate limiting
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/myproject
#   sudo ln -s /etc/nginx/sites-available/myproject /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------


# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------

# Define a rate limit zone. $binary_remote_addr uses 4 bytes per IPv4 address
# (much smaller than $remote_addr). 10m of shared memory holds about 160,000
# addresses. 10r/s allows 10 requests per second per IP with burst capacity.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# Stricter zone for login and authentication endpoints.
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;


# ---------------------------------------------------------------------------
# Upstream: Gunicorn application server
# ---------------------------------------------------------------------------

upstream django_app {
    # Use a Unix socket when Nginx and Gunicorn run on the same host.
    # This avoids TCP overhead.
    # server unix:/run/gunicorn/myproject.sock fail_timeout=0;

    # Use TCP when Gunicorn runs in a separate container or host.
    server 127.0.0.1:8000 fail_timeout=0;

    # For multiple Gunicorn instances behind a load balancer:
    # server app1:8000;
    # server app2:8000;
}


# ---------------------------------------------------------------------------
# Redirect HTTP to HTTPS
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Let's Encrypt ACME challenge must remain accessible over HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}


# ---------------------------------------------------------------------------
# HTTPS server
# ---------------------------------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # ----- TLS configuration (Let's Encrypt) -----

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Mozilla "Intermediate" TLS configuration.
    # https://ssl-config.mozilla.org/
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP stapling for faster TLS handshakes.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # DH parameters for DHE ciphers. Generate with:
    #   openssl dhparam -out /etc/nginx/dhparam.pem 2048
    # ssl_dhparam /etc/nginx/dhparam.pem;

    # TLS session caching for connection reuse.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;


    # ----- Security headers -----

    # Strict Transport Security: tell browsers to always use HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent MIME type sniffing.
    add_header X-Content-Type-Options "nosniff" always;

    # Clickjacking protection. Use DENY or SAMEORIGIN depending on whether
    # you need to embed your site in iframes.
    add_header X-Frame-Options "DENY" always;

    # Cross-site scripting filter (legacy browsers).
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy: send origin only for cross-origin requests.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy: disable features you do not use.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy. Customize per your frontend requirements.
    # This is a baseline; tighten script-src and style-src for your app.
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;


    # ----- Gzip compression -----

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy
        text/xml;


    # ----- Request size limits -----

    client_max_body_size 10M;


    # ----- Static files -----

    # Served directly by Nginx. Django's collectstatic writes files here.
    location /static/ {
        alias /app/staticfiles/;

        # Far-future expiry. WhiteNoise appends content hashes to filenames,
        # so aggressive caching is safe.
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----- Media files (user uploads) -----

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ----- Favicon -----

    location = /favicon.ico {
        alias /app/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # ----- Rate-limited auth endpoints -----

    location ~ ^/(admin/login|api/auth|accounts/login) {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://django_app;
        include /etc/nginx/proxy_params_django;
    }

    # ----- Application (proxied to Gunicorn) -----

    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://django_app;

        # Standard proxy headers so Django sees the real client IP and
        # knows the original request was HTTPS.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Timeouts matching gunicorn's timeout setting.
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Disable buffering for streaming responses (SSE, chunked downloads).
        # Enable if your app does not need streaming.
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;

        # WebSocket support (uncomment if using Django Channels).
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }

    # ----- Deny access to hidden files -----

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
